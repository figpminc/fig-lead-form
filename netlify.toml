[build]
functions = "netlify/functions"
publish = "."

[[redirects]]
from = "/submit"
to = "/.netlify/functions/submit"
status = 200
force = true

[functions."leasing-fees-scheduled"]
schedule = "0 13 1 * *"

[functions."owner-billing-scheduled"]
# 1st of each month at 14:00 UTC (9 AM EST / 10 AM EDT), an hour after the leasing-fee bills
schedule = "0 14 1 * *"

[functions."ruby-match-scheduled"]
# every 5 minutes
schedule = "*/5 * * * *"

[functions."notice-check-scheduled"]
# daily at 13:00 UTC (8 AM EST / 9 AM EDT); the function only acts on the 6th and on Thursdays
schedule = "0 13 * * *"
